<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Love You ❤️</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      height:100vh;
      background: linear-gradient(135deg,#ff758c,#ff7eb3);
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      text-align:center;
      color:white;
      position:relative;
    }

    .love-box{
      z-index:2;
      animation:fadeIn 2s ease;
    }

    .love-box h1{
      font-size:4rem;
      font-weight:700;
    }

    .love-box p{
      font-size:1.3rem;
      margin-top:15px;
    }

    .love-btn{
      margin-top:25px;
      padding:12px 35px;
      border:none;
      border-radius:50px;
      background:white;
      color:#ff4b6e;
      font-weight:600;
      transition:0.3s;
    }

    .love-btn:hover{
      transform:scale(1.1);
      background:#ff4b6e;
      color:white;
    }

    .heart{
      position:absolute;
      font-size:25px;
      animation:float 6s linear infinite;
      opacity:0.8;
    }

    @keyframes float{
      0%{
        transform:translateY(100vh) scale(0);
      }
      100%{
        transform:translateY(-10vh) scale(1.5);
      }
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(30px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @media(max-width:768px){
      .love-box h1{
        font-size:2.5rem;
      }

      .love-box p{
        font-size:1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Floating Hearts -->
  <div class="heart" style="left:10%; animation-duration:5s;">❤️</div>
  <div class="heart" style="left:30%; animation-duration:7s;">💖</div>
  <div class="heart" style="left:50%; animation-duration:6s;">💕</div>
  <div class="heart" style="left:70%; animation-duration:8s;">💘</div>
  <div class="heart" style="left:90%; animation-duration:5s;">❤️</div>

  <!-- Main Content -->
  <div class="love-box">
    <h1>I LOVE YOU ❤️</h1>
    <p>
      You are my happiness, my peace, and my favorite person forever 💕
    </p>

    <button class="love-btn" onclick="showMessage()">
      Click Me 💌
    </button>
  </div>

  <script>
    function showMessage(){
      alert("No matter what happens, I will always love you ❤️");
    }
  </script>

</body>
</html>
